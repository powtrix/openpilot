name: tests

on:
  push:
    branches:
      - carrot-wip
      - dkcarrot-wip
  pull_request:
    branches:
      - dkcarrot-wip
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/carrot-wip' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1

jobs:
  build_release:
    name: build release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: ./tools/op.sh setup
      - name: Build openpilot
        run: scons
      - name: Import the real DK UI startup graph
        if: github.ref == 'refs/heads/dkcarrot-wip' || github.base_ref == 'dkcarrot-wip'
        timeout-minutes: 2
        env:
          SCALE: '1'
          BIG: '1'
          OPENPILOT_PREFIX: dk-ui-import-ci
        # Do not start main(), open a window, or substitute mocked pyray types.
        run: |
          python - <<'PY'
          from openpilot.common.prefix import OpenpilotPrefix
          with OpenpilotPrefix():
            import openpilot.selfdrive.ui.ui
            import openpilot.selfdrive.controls.controlsd
            import openpilot.selfdrive.carrot.dk_vehicle_diagnostics
            import openpilot.selfdrive.carrot.dk_diagnosticsd
            print("DK UI and passive diagnostics startup imports passed")
          PY
      - name: Build DK CAN replay test library
        if: github.ref == 'refs/heads/dkcarrot-wip' || github.base_ref == 'dkcarrot-wip'
        timeout-minutes: 2
        run: scons -C tools/dk -f safety_tests.scons
      - name: Verify DK startup and display regressions
        if: github.ref == 'refs/heads/dkcarrot-wip' || github.base_ref == 'dkcarrot-wip'
        timeout-minutes: 5
        env:
          SCALE: '1'
          BIG: '1'
          OPENPILOT_PREFIX: dk-ui-tests-ci
        run: |
          python -m pytest -o addopts='' -q \
            openpilot/selfdrive/ui/tests/test_dk_model_renderer_runtime_import.py \
            openpilot/selfdrive/ui/tests/test_carrot_model_renderer_lane_visibility.py \
            openpilot/selfdrive/ui/tests/test_carrot_hud_renderer.py \
            openpilot/selfdrive/ui/tests/test_stock_scc_braking.py \
            opendbc/car/hyundai/tests/test_dk_stock_scc_display.py \
            opendbc/car/hyundai/tests/test_stock_scc_resume.py \
            opendbc/car/hyundai/tests/test_stock_scc_can_replay.py \
            opendbc/car/hyundai/tests/test_jerk.py \
            openpilot/selfdrive/ui/tests/test_dk_deployment.py \
            openpilot/selfdrive/ui/tests/test_cluster_hud_camera_suppression.py \
            openpilot/selfdrive/ui/tests/test_text_draw_offsets.py \
            openpilot/selfdrive/ui/tests/test_dk_ui_startup_workflow.py \
            openpilot/selfdrive/carrot/tests/test_dk_vehicle_diagnostics.py \
            openpilot/selfdrive/carrot/tests/test_dk_turn_return.py \
            openpilot/selfdrive/carrot/tests/test_dk_diagnosticsd.py \
            openpilot/selfdrive/carrot/tests/test_dk_log_transfer.py \
            openpilot/selfdrive/controls/tests/test_dk_lateral_diagnostics.py \
            openpilot/selfdrive/controls/tests/test_ka4_lateral_sign.py \
            tools/car_porting/test_dk_diagnostics_report.py \
            tools/dk/tests/test_check_ui_annotations.py
          python tools/dk/check_ui_annotations.py --commit HEAD
