services:
  dk-upload:
    container_name: dk-upload
    platform: linux/amd64
    build: .
    image: dk-upload:2.0.0
    restart: unless-stopped
    init: true
    environment:
      CARROT_UPLOAD_ROOT: /data/openpilot
      CARROT_UPLOAD_DB: /data/state/uploads.sqlite3
      CARROT_ALLOWED_DEVICE_IDS: "${DK_UPLOAD_ALLOWED_DEVICE_ID:?set the private device ID}"
      CARROT_ALLOWED_DEVICE_PUBLIC_KEY_SHA256: "${DK_UPLOAD_ALLOWED_DEVICE_ID:?set the private device ID}=${DK_UPLOAD_DEVICE_PUBLIC_KEY_SHA256:?set the exact lowercase SHA-256 SPKI fingerprint}"
      CARROT_LEGACY_UPLOADS_ENABLED: "false"
      CARROT_DAILY_DEVICE_QUOTA_BYTES: "1073741824"
      CARROT_DAILY_IP_QUOTA_BYTES: "8589934592"
      CARROT_MAX_FILE_BYTES: "536870912"
      CARROT_MIN_FREE_BYTES: "10737418240"
      CARROT_VALIDATION_FREE_SPACE_RESERVE_BYTES: "1073741824"
      CARROT_SESSION_TTL_SECONDS: "14400"
      CARROT_SESSION_RATE_BUCKET_LIMIT: "4096"
      CARROT_REQUEST_CONCURRENT_PER_IP: "4"
      CARROT_REQUEST_CONCURRENT_GLOBAL: "16"
      CARROT_VALIDATION_REQUEST_CONCURRENT_PER_IP: "4"
      CARROT_VALIDATION_REQUEST_CONCURRENT_GLOBAL: "16"
      CARROT_CONCURRENT_PER_DEVICE: "3"
      CARROT_CONCURRENT_GLOBAL: "16"
      CARROT_VALIDATION_CONCURRENT_PER_DEVICE: "2"
      CARROT_VALIDATION_CONCURRENT_GLOBAL: "8"
      CARROT_UPLOAD_IDLE_TIMEOUT_SECONDS: "60"
      CARROT_UPLOAD_TOTAL_TIMEOUT_SECONDS: "21600"
      CARROT_JSON_BODY_IDLE_TIMEOUT_SECONDS: "10"
      CARROT_JSON_BODY_TOTAL_TIMEOUT_SECONDS: "30"
      CARROT_PROGRESS_COMMIT_BYTES: "1048576"
      CARROT_PROGRESS_COMMIT_INTERVAL_SECONDS: "1"
      CARROT_VALIDATION_CHALLENGE_TTL_SECONDS: "300"
      CARROT_VALIDATION_SESSION_TTL_SECONDS: "1800"
      CARROT_VALIDATION_AUDIENCE: "https://adot.synology.me/api/v1/validation"
      CARROT_VALIDATION_VERIFY_TIMEOUT_SECONDS: "5"
      CARROT_VALIDATION_VERIFY_CONCURRENT: "4"
      CARROT_VALIDATION_VERIFY_ATTEMPT_LIMIT: "5"
      CARROT_VALIDATION_VERIFY_COOLDOWN_SECONDS: "2"
      CARROT_VALIDATION_HASH_CONCURRENT: "2"
      CARROT_RESERVATION_LEASE_SECONDS: "7200"
      CARROT_STALE_PART_SECONDS: "7200"
      CARROT_CLEANUP_INTERVAL_SECONDS: "900"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - dk-upload-internal
    user: "10001:10001"
    volumes:
      - /volume1/openpilot/.carrot-validation-v1:/data/openpilot/.carrot-validation-v1:rw
      - /volume1/docker/dk-upload/state:/data/state:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.5
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2));
          assert d.get('ok') is True and d.get('service') == 'dk-upload'
          and d.get('deviceAllowlistConfigured') is True
          and d.get('deviceKeyPinsConfigured') is True
          and d.get('legacyUploadsEnabled') is False
          and d.get('storageWritable') is True
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dk-upload-internal:
    name: dk-upload-internal
    driver: bridge
    internal: true
    labels:
      dk.openpilot.receiver-network: "true"
